<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Tracking</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            margin: 0;
            overflow: auto;
            background-color: rgb(10, 10, 10);
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .asteroid-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .asteroid-item {
            margin: 10px;
            overflow: hidden;
            border-radius: 15px;
            /* Rounded corners */
            box-shadow: 0 0 10px rgba(164, 164, 164, 0.5);
            /* Soft glow effect */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: rgba(0, 0, 0, 0.5);
            /* Semi-transparent background */
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .asteroid-item img {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .asteroid-gallery-caption {
            padding: 8px 10px;
            font-size: 0.8rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .asteroid-item img.loaded {
            opacity: 1;
        }
    </style>
</head>

<body>
    <canvas id="starry-background"></canvas>
    <header>
        <nav>
            <ul>
                <li><a style="white-space: nowrap;" href="index.html">Home</a></li>
                <li><a style="white-space: nowrap;" href="astro.html">Astro Images</a></li>
                <li><a style="white-space: nowrap;" href="asteroids.html">Asteroids</a></li>
                <li><a style="white-space: nowrap;" href="astro_tools.html">Astro Tools</a></li>
                <li><a style="white-space: nowrap;" href="about.html">About Me</a></li>
                <li><a style="white-space: nowrap;" href="hikes.html">Hikes</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="asteroid-gallery" id="asteroid-gallery">
            <!-- Asteroid gifs will be dynamically added here -->
        </div>
    </main>
    <script src="src/starry-background.js"></script>
    <script>
        const asteroidData = [
            { title: "Kaluna - 10686", src: "assets/asteroids/Kaluna_(10686).gif" },
            { title: "Walkure - 477", src: "assets/asteroids/Walkure_(877).gif" },
            { title: "1999 GB37 - 56209", src: "assets/asteroids/1999 GB37_(56209).gif" }
        ];
        function createAsteroidItem(asteroid) {
            const item = document.createElement('div');
            item.className = 'asteroid-item';

            const img = document.createElement('img');
            img.alt = `${asteroid.title} tracking animation`;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.src = asteroid.src;
            revealWhenReady(img);

            const caption = document.createElement('span');
            caption.className = 'asteroid-gallery-caption';
            caption.textContent = asteroid.title;

            item.appendChild(img);
            item.appendChild(caption);
            return item;
        }

        function resizeAsteroidItems() {
            const size = Math.floor(window.innerHeight * 0.4);
            document.querySelectorAll('.asteroid-item').forEach(item => {
                item.style.width = `${size}px`;
                item.style.height = `${size}px`;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const gallery = document.getElementById('asteroid-gallery');
            asteroidData.forEach(asteroid => {
                gallery.appendChild(createAsteroidItem(asteroid));
            });
            resizeAsteroidItems();
        });

        window.addEventListener('resize', resizeAsteroidItems);

        function revealWhenReady(img) {
            const show = () => requestAnimationFrame(() =>
                requestAnimationFrame(() => img.classList.add('loaded'))
            );

            if (img.complete && img.naturalWidth > 0) {
                show();
            } else {
                img.addEventListener('load', show, { once: true });
                img.addEventListener('error', show, { once: true });
            }
        }
    </script>
</body>

</html>
