<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Star Map</title>
    <link rel="stylesheet" href="src/common.css">
    <style>
        body {
            margin: 0;
            overflow: auto;
            background-color: rgb(10, 10, 10);
        }

        p,
        li {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        #aladin-lite-div .aladin-location {
            top: auto;
            bottom: 0;
            left: 80%;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a style="white-space: nowrap;" href="index.html">Home</a></li>
                <li><a style="white-space: nowrap;" href="astro.html">Astro Images</a></li>
                <li><a style="white-space: nowrap;" href="asteroids.html">Asteroids</a></li>
                <li><a style="white-space: nowrap;" href="astro_tools.html">Astro Tools</a></li>
                <li><a style="white-space: nowrap;" href="starmap.html">Star Map</a></li>

                <li><a style="white-space: nowrap;" href="about.html">About Me</a></li>
            </ul>
        </nav>
    </header>


    <!-- Star Map -->
    <div id="aladin-lite-div" style="height: 100vh"></div>
    <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"
        charset="utf-8"></script>

    <script type="text/javascript">
        let aladin;
        A.init.then(() => {
            aladin = A.aladin('#aladin-lite-div', {
                fov: 60,
                projection: "SIN",
                cooFrame: 'equatorial',
                survey: 'P/Mellinger/color',
                showFullscreenControl: false,
                toolbar: {
                    position: 'bottomleft'
                },
                showLayersControl: true,
                showCooGridControl: true,
                showProjectionControl: false,
                showFrame: false
            });
        });
    </script>
</body>

</html>
