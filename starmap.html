    <link rel="stylesheet" href="src/common.css">
    <style>
        body {
            margin: 0;
            overflow: auto;
            background-color: rgb(10, 10, 10);
        }

        p,
        li {
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        #aladin-lite-div .aladin-location {
            top: auto;
            bottom: 0;
            left: 80%;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a style="white-space: nowrap;" href="index.html">Home</a></li>
                <li><a style="white-space: nowrap;" href="astro.html">Astro Images</a></li>
                <li><a style="white-space: nowrap;" href="asteroids.html">Asteroids</a></li>

                <li><a style="white-space: nowrap;" href="about.html">About Me</a></li>
            </ul>
        </nav>
    </header>

    <!-- setup contingency if aladin is unavailable-->
    <div id="content-unavailable-textbox"
        style="display: flex; justify-content: center; align-items: center; min-height: calc(100dvh - 80px);"></div>
    <script>
        function handleLoadError() {
            // Hide aladin viewport before displaying error message
            document.getElementById("aladin-lite-div").style.display = "none";

            const container = document.getElementById('content-unavailable-textbox');
            container.innerHTML = `
                <div style="color: #d9534f; padding: 10px; border: 1px solid #d9534f; background-color: #fdf7f7;">
                    <strong>Content Unavailable:</strong> Failed to retrieve aladin dependency scripts. Please refresh or try again later.
                </div>
            `;
        }
    </script>

    <!-- Star Map -->
    <div id="aladin-lite-div" style="height: 100vh"></div>

    <script type="text/javascript"
        charset="utf-8" onerror="handleLoadError()">
            setTimeout(() => {
                const script = document.createElement('script');
                script.src = 'https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js';
                script.async = false; // Optional: prevents blocking page parsing

                document.head.appendChild(script);
            }, 3000); // = 3 seconds delay
        </script>

    <script type="text/javascript" src="src/starmap.js"></script>
</body>

</html>
